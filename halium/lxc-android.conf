# LXC Android container configuration
# Device:  OnePlus 11 (salami)
# SoC:     Qualcomm SM8550 (Snapdragon 8 Gen 2 / kalama)
# GPU:     Adreno 740
#
# Installed to /var/lib/lxc/android/config on the Droidian rootfs.

lxc.net.0.type = none
lxc.uts.name = halium

# Android rootfs (populated by halium-install)
lxc.rootfs.path = dir:/var/lib/lxc/android/rootfs

# Auto-mount: proc mixed (hide host PIDs), sys mixed, cgroup v2 mixed
lxc.mount.auto = proc:mixed sys:mixed cgroup:mixed

# Bind /dev from host so Android can see all hardware nodes
lxc.mount.entry = /dev                          dev                         none bind,create=dir                         0 0
lxc.mount.entry = /dev/pts                      dev/pts                     none bind,create=dir                         0 0
lxc.mount.entry = /dev/socket                   dev/socket                  none bind,create=dir,optional                0 0
lxc.mount.entry = /dev/input                    dev/input                   none bind,create=dir,optional                0 0
lxc.mount.entry = /dev/media0                   dev/media0                  none bind,create=file,optional               0 0
lxc.mount.entry = /dev/media1                   dev/media1                  none bind,create=file,optional               0 0
lxc.mount.entry = /dev/video0                   dev/video0                  none bind,create=file,optional               0 0
lxc.mount.entry = /dev/video1                   dev/video1                  none bind,create=file,optional               0 0
lxc.mount.entry = /dev/video32                  dev/video32                 none bind,create=file,optional               0 0
lxc.mount.entry = /dev/video33                  dev/video33                 none bind,create=file,optional               0 0

# DRM / display
lxc.mount.entry = /dev/dri                      dev/dri                     none bind,create=dir,optional                0 0

# Qualcomm GPU (KGSL)
lxc.mount.entry = /dev/kgsl-3d0                 dev/kgsl-3d0                none bind,create=file,optional               0 0

# DMA-buf heaps (replace legacy ION on Android 12+)
lxc.mount.entry = /dev/dmabuf_heaps             dev/dmabuf_heaps            none bind,create=dir,optional                0 0

# Qualcomm IPC router / SMD / QMI (modem, sensor hub, DSP)
lxc.mount.entry = /dev/smdpkt0                  dev/smdpkt0                 none bind,create=file,optional               0 0
lxc.mount.entry = /dev/qmi0                     dev/qmi0                    none bind,create=file,optional               0 0
lxc.mount.entry = /dev/qmi1                     dev/qmi1                    none bind,create=file,optional               0 0
lxc.mount.entry = /dev/qmi2                     dev/qmi2                    none bind,create=file,optional               0 0

# USB gadget / configfs — bind so Android can manage USB roles
lxc.mount.entry = /sys/kernel/config            sys/kernel/config           none bind,create=dir,optional                0 0

# sysfs subtrees Android needs for sensor and power management
lxc.mount.entry = /sys/devices/platform/soc     sys/devices/platform/soc    none bind,create=dir                         0 0
lxc.mount.entry = /sys/devices/virtual          sys/devices/virtual         none bind,create=dir                         0 0
lxc.mount.entry = /sys/bus                      sys/bus                     none bind,create=dir                         0 0
lxc.mount.entry = /sys/class                    sys/class                   none bind,create=dir                         0 0
lxc.mount.entry = /sys/kernel/debug             sys/kernel/debug            none bind,create=dir,optional                0 0

# Block devices needed by Android vold
lxc.mount.entry = /dev/block                    dev/block                   none bind,create=dir                         0 0

# Android data partition — bind from host /data
lxc.mount.entry = /data                         data                        none bind,create=dir                         0 0

# Firmware (modem, DSP, BT) — read-only inside container
lxc.mount.entry = /vendor/firmware_mnt          vendor/firmware_mnt         none bind,ro,create=dir,optional            0 0
lxc.mount.entry = /vendor/dsp                   vendor/dsp                  none bind,ro,create=dir,optional            0 0
lxc.mount.entry = /vendor/bt_firmware           vendor/bt_firmware          none bind,ro,create=dir,optional            0 0

# -----------------------------------------------------------------------
# cgroup device policy
# Start with a blanket deny, then allow exactly what Android needs.
# -----------------------------------------------------------------------
lxc.cgroup.devices.deny = a

# Allow mknod for all char and block devices (needed by Android's ueventd)
lxc.cgroup.devices.allow = c *:* m
lxc.cgroup.devices.allow = b *:* m

# Standard character devices
lxc.cgroup.devices.allow = c 1:3 rwm    # /dev/null
lxc.cgroup.devices.allow = c 1:5 rwm    # /dev/zero
lxc.cgroup.devices.allow = c 1:7 rwm    # /dev/full
lxc.cgroup.devices.allow = c 1:8 rwm    # /dev/random
lxc.cgroup.devices.allow = c 1:9 rwm    # /dev/urandom
lxc.cgroup.devices.allow = c 5:0 rwm    # /dev/tty
lxc.cgroup.devices.allow = c 5:1 rwm    # /dev/console
lxc.cgroup.devices.allow = c 5:2 rwm    # /dev/ptmx
lxc.cgroup.devices.allow = c 10:* rwm   # misc (includes kgsl, qmi, etc.)
lxc.cgroup.devices.allow = c 13:* rwm   # input
lxc.cgroup.devices.allow = c 29:0 rwm   # /dev/fb0 (legacy framebuffer)

# DRM (major 226)
lxc.cgroup.devices.allow = c 226:* rwm

# TTY/serial (for debug UART ttyMSM0)
lxc.cgroup.devices.allow = c 4:* rwm
lxc.cgroup.devices.allow = c 204:* rwm

# Block devices (UFS, loop)
lxc.cgroup.devices.allow = b 7:* rwm    # loop devices
lxc.cgroup.devices.allow = b 8:* rwm    # sd* (USB storage)
lxc.cgroup.devices.allow = b 259:* rwm  # nvme/blkext (UFS shows here on 5.x+)

# Video/media nodes (camera, codec)
lxc.cgroup.devices.allow = c 81:* rwm   # video4linux

# -----------------------------------------------------------------------
# Container entry point
# -----------------------------------------------------------------------
lxc.init.cmd = /init
lxc.environment = PATH=/sbin:/bin:/usr/sbin:/usr/bin:/vendor/bin:/system/bin
