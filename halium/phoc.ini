# Phoc Wayland compositor configuration for OnePlus 11 (salami)
# Installed to /etc/phoc.ini on the Droidian rootfs by halium-install.
#
# SM8550 display pipeline: msm-dsi → DRM connector DSI-1
# Panel: Samsung AMOLED, 1080x2376, 120 Hz, 6.7"
# Physical PPI ≈ 389  →  scale 2.5 gives ~156 logical PPI (HiDPI comfortable)

[output:DSI-1]
# Scale factor: 2.5 maps 1080x2376 physical → 432×950 logical pixels.
# If UI elements feel too large/small, try 2.0 (540×1188) or 3.0 (360×792).
scale = 2.5
# Portrait — no rotation needed for the stock panel orientation.
transform = normal

[core]
# Enable xwayland for any legacy X11 apps
xwayland = true

# Allow any Wayland client to become the output handler
# (needed for phosh to take over the DRM output without root)
enable-key-shortcuts = false
