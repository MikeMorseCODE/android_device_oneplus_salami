# NetworkManager ofono integration for Droidian on OnePlus 11 (salami)
# Installed to /etc/NetworkManager/conf.d/10-ofono.conf by halium-install.
#
# Enables the ofono plugin so NetworkManager creates mobile data
# connections through ofono's GPRS context API instead of talking
# to ModemManager directly.  ofono connects to Android's qcrild
# via binder (see /etc/ofono/ril_subscription.conf).

[main]
plugins=ofono

# Do not automatically create default connections for unmanaged devices
# (prevents NM from trying to manage rmnet_data* before ofono is ready).
no-auto-default=*

[device]
# Match the rmnet data interfaces that qcrild/IPA expose
wifi.scan-rand-mac-address=no
