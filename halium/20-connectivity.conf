# Disable NetworkManager connectivity checks on first boot.
# Installed to /etc/NetworkManager/conf.d/20-connectivity.conf by halium-install.
#
# On first boot there is no configured WiFi and the SIM/modem may still
# be initialising via ofono.  Without this, NM fires misleading 'limited
# connectivity' D-Bus signals that confuse Phosh's status bar and can
# cause some apps to refuse to start.
#
# Re-enable after confirming network connectivity works:
#   rm /etc/NetworkManager/conf.d/20-connectivity.conf
#   systemctl restart NetworkManager

[connectivity]
enabled=false
