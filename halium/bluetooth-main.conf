# BlueZ main.conf for OnePlus 11 (salami) on Droidian
# Installed to /etc/bluetooth/main.conf by halium-install.
#
# SM8550 Bluetooth: Qualcomm WCN6855 (QCA6390-family)
# The Android container starts vendor.bluetooth-service-qti which loads
# WCN6855 firmware over UART (btfmslim) and registers hci0 with the
# Linux kernel. BlueZ then manages hci0 for Droidian userspace.

[General]
Name = OnePlus 11
Class = 0x000100
DiscoverableTimeout = 180
AlwaysPairable = true

# Enable LE (required for BLE peripherals, AirPods, etc.)
EnableLE = true
AttributeServer = true

# FastConnectable: reduces reconnect time for paired devices
FastConnectable = true

[Policy]
# Automatically power on hci0 when BlueZ starts.
# hci0 won't exist until the Android BT HAL has loaded firmware,
# so AutoEnable retries until the device appears.
AutoEnable = true
ReconnectAttempts = 7
ReconnectIntervals = 1,2,4,8,16,32,64

[GATT]
Cache = always

[LE]
# Advertising interval for LE broadcasting (ms)
MinAdvertisementInterval = 200
MaxAdvertisementInterval = 500
