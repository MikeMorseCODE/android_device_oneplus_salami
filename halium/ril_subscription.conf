# ofono RIL subscription configuration
# Device:  OnePlus 11 (salami)
# SoC:     SM8550 (kalama) — Qualcomm Snapdragon 8 Gen 2
# Modem:   Snapdragon X70, DSDS (Dual SIM Dual Standby)
#
# qcrild exposes the modem via Android 12 AIDL IRadio binder interfaces:
#   slot1 → primary SIM (nano-SIM tray slot 1)
#   slot2 → secondary SIM (nano-SIM tray slot 2)
#
# ofono connects to these through the ofono-binder-plugin.
# Installed to /etc/ofono/ril_subscription.conf by halium-install.

[ril_0]
transport=binder:android.hardware.radio@1.6::IRadio/slot1
name=ril1
slot=1
4g-enabled=true
uicc-workaround=true

[ril_1]
transport=binder:android.hardware.radio@1.6::IRadio/slot2
name=ril2
slot=2
4g-enabled=true
uicc-workaround=true
