# ofono daemon configuration for Droidian on OnePlus 11 (salami)
# Installed to /etc/ofono/ofono.conf by halium-install.
#
# References:
#   https://git.kernel.org/pub/scm/network/ofono/ofono.git/tree/doc

[General]
# Don't attempt to load the phonesim plugin on real hardware.
NoAutoCreateModem=true

# Restrict plugin loading to what SM8550 actually needs.
# binder     — Android 12 AIDL IRadio (qcrild)
# qmimodem   — QMI fallback (unused unless binder init fails)
# ril        — legacy RIL socket fallback
# sim        — SIM management
# gprs       — mobile data contexts
# voicecall  — voice calls
# sms        — SMS/MMS
# netreg     — network registration
# ussd       — USSD codes (*#06# etc)
# phonebook  — SIM phonebook
# ims        — IMS/VoLTE registration
Plugins=binder,ril,qmimodem,sim,gprs,voicecall,sms,netreg,ussd,phonebook,ims
