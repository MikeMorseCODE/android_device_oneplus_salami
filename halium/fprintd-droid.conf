# fprintd configuration for under-display fingerprint on OnePlus 11 (salami)
# Installed to /etc/fprintd/fprintd.conf by halium-install.
#
# The OnePlus 11 has a Qualcomm under-display optical fingerprint sensor
# exposed through the Android android.hardware.biometrics.fingerprint@2.3
# HAL (vendor.qti.hardware.fingerprint). fprintd-droid bridges between
# fprintd and that HAL via libhybris.
#
# Required packages on the Droidian rootfs:
#   fprintd-droid (from droidian.org apt repo)

[daemon]
# Use the droid (hybris) backend instead of the libfprint USB backend
driver=droid

[droid]
# Android HAL service name as registered in the binder service manager
hal-service=android.hardware.biometrics.fingerprint@2.3::IBiometricsFingerprint/default

# Grace period after a failed scan before re-prompting (ms)
retry-delay=500

# Maximum enroll stages (Android HAL returns this; we set a safe upper bound)
max-enroll-stages=20
