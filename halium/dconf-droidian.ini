# dconf vendor database overrides for Droidian on OnePlus 11 (salami)
# Installed to /etc/dconf/db/vendor.d/10-droidian.ini by halium-install.
# Compiled with: dconf update
#
# These are soft defaults — the user can override all of them in
# Settings → Display / Appearance.

[org/gnome/desktop/interface]
# UI scale factor. Phoc renders at scale=2.5 (phoc.ini); dconf scale=2
# tells GTK/Qt to use the @2x resource set. The fractional part is
# handled by Phoc's compositor-side scaling.
scaling-factor=uint32 2
text-scaling-factor=1.0
# Default to dark theme — AMOLED saves battery and looks better
color-scheme='prefer-dark'
cursor-size=24

[org/gnome/desktop/a11y/magnifier]
scroll-at-edges=false

[org/gnome/settings-daemon/plugins/color]
night-light-enabled=true
night-light-temperature=uint32 4000

[org/gnome/desktop/sound]
event-sounds=false

[org/sigxcpu/feedbackd]
profile='full'
